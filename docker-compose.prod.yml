services:
  app:
    build:
      context: .
      target: runtime
    restart: always
    environment:
      NODE_ENV: production
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - logs:/app/logs
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - session-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-session_db}
      POSTGRES_USER: ${DB_USER:-session_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - session-network
    # No external port exposure in production – Nginx connects internally

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/app/public:ro
    depends_on:
      - app
    networks:
      - session-network

volumes:
  postgres-data:
  logs:
  uploads:

networks:
  session-network:
    driver: bridge
