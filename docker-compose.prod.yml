services:
  app:
    image: ${REGISTRY_URL:-local}/session:${IMAGE_TAG:-latest}
    container_name: session-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - logs:/app/logs
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - session-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: session-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-session_db}
      POSTGRES_USER:     ${DB_USER:-session_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - session-network
    # No external port exposure in production – Nginx connects internally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-session_user} -d ${DB_NAME:-session_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: session-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - session-network

  migrate:
    image: ${REGISTRY_URL:-local}/session:${IMAGE_TAG:-latest}
    container_name: session-migrate
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - session-network
    profiles:
      - migrate

volumes:
  postgres-data:
  logs:
  uploads:

networks:
  session-network:
    driver: bridge
