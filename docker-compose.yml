services:
  app:
    build:
      context: .
      target: runtime
    container_name: session-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://session_user:session_pass@db:5432/session_db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-00000000000000000000000000000000}
    volumes:
      - ./config:/app/config
      - logs:/app/logs
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - session-network

  db:
    image: postgres:15-alpine
    container_name: session-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: session_db
      POSTGRES_USER: session_user
      POSTGRES_PASSWORD: session_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session_user -d session_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - session-network

  migrate:
    build:
      context: .
      target: runtime
    container_name: session-migrate
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js"
    environment:
      DATABASE_URL: postgresql://session_user:session_pass@db:5432/session_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - session-network
    profiles:
      - migrate

  # OpenLDAP – local AD mock for development
  # Activate with: docker compose --profile ldap up -d
  ldap:
    image: osixia/openldap:1.5.0
    container_name: session-ldap
    environment:
      LDAP_ORGANISATION: "Session Dev"
      LDAP_DOMAIN: "dev.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks:
      - session-network
    profiles:
      - ldap

volumes:
  postgres-data:
  uploads:
  logs:
  ldap-data:
  ldap-config:

networks:
  session-network:
    driver: bridge
